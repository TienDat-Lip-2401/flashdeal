
services:
  # 1. Cơ sở dữ liệu: PostgreSQL 16
  flashdeal-db:
    image: postgres:16-alpine
    container_name: flashdeal-db
    restart: always
    environment:
      POSTGRES_DB: flashdeal_db
      POSTGRES_USER: flashdeal_user
      POSTGRES_PASSWORD: flashdeal_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flashdeal-net

  # 2. Cache & Cổng chặn: Redis 7
  flashdeal-redis:
    image: redis:7-alpine
    container_name: flashdeal-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - flashdeal-net

  # 3. Message Broker: Apache Kafka 3.7 (KRaft Mode)
  flashdeal-kafka:
    image: apache/kafka:3.7.0
    container_name: flashdeal-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://flashdeal-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@flashdeal-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - flashdeal-net

  # 4. Giao diện Web Giám sát: Kafka-UI
  flashdeal-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flashdeal-kafka-ui
    restart: always
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: flashdeal-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: flashdeal-kafka:9092
    depends_on:
      - flashdeal-kafka
    networks:
      - flashdeal-net

  # 5. Ứng dụng Backend: Flashdeal API (Spring Boot)
  flashdeal-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flashdeal-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=flashdeal-db
      - DB_PORT=5432
      - DB_NAME=flashdeal_db
      - DB_USERNAME=flashdeal_user
      - DB_PASSWORD=flashdeal_password
      - REDIS_HOST=flashdeal-redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=flashdeal-kafka:9092
    depends_on:
      - flashdeal-db
      - flashdeal-redis
      - flashdeal-kafka
    networks:
      - flashdeal-net

networks:
  flashdeal-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data: