# Cấu hình giới hạn kích thước file Log cho toàn bộ Container (Ngăn chặn tràn ổ C)
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ==========================================
  # 1. POSTGRESQL 16 (Chứa các Database riêng biệt)
  # ==========================================
  flashdeal-db:
    image: postgres:16-alpine
    container_name: flashdeal-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Ho_Chi_Minh
      POSTGRES_USER: flashdeal_user
      POSTGRES_PASSWORD: flashdeal_password
      POSTGRES_DB: flashdeal_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - flashdeal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashdeal_user -d flashdeal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. REDIS 7 (In-Memory Cache & Search ZSET)
  # ==========================================
  flashdeal-redis:
    image: redis:7-alpine
    container_name: flashdeal-redis
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - redis_data:/data
    networks:
      - flashdeal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. APACHE KAFKA 3.7 (Chế độ KRaft)
  # ==========================================
  flashdeal-kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: flashdeal-kafka
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "9092:9092"
    environment:
      TZ: Asia/Ho_Chi_Minh
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://flashdeal-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@flashdeal-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - flashdeal-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 4. KAFKA UI (Giao diện quản lý Topics & Partitions)
  # ==========================================
  flashdeal-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: flashdeal-kafka-ui
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8085:8080"
    environment:
      TZ: Asia/Ho_Chi_Minh
      KAFKA_CLUSTERS_0_NAME: flashdeal-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: flashdeal-kafka:29092
    depends_on:
      flashdeal-kafka:
        condition: service_healthy
    networks:
      - flashdeal-network

  # ==========================================
  # 5. PRODUCT & SEARCH SERVICE (:8082)
  # ==========================================
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: flashdeal-product-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8082:8082"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://flashdeal-db:5432/product_db
      SPRING_DATASOURCE_USERNAME: flashdeal_user
      SPRING_DATASOURCE_PASSWORD: flashdeal_password
      SPRING_DATA_REDIS_HOST: flashdeal-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: flashdeal-kafka:29092
      JWT_SECRET_KEY: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      flashdeal-db:
        condition: service_healthy
      flashdeal-redis:
        condition: service_healthy
      flashdeal-kafka:
        condition: service_healthy
    networks:
      - flashdeal-network

  # ==========================================
  # 6. AUTH & USER SERVICE (:8081)
  # ==========================================
  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: flashdeal-auth-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8081:8081"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://flashdeal-db:5432/auth_db
      SPRING_DATASOURCE_USERNAME: flashdeal_user
      SPRING_DATASOURCE_PASSWORD: flashdeal_password
      SPRING_DATA_REDIS_HOST: flashdeal-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: flashdeal-kafka:29092
      JWT_SECRET_KEY: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      flashdeal-db:
        condition: service_healthy
      flashdeal-redis:
        condition: service_healthy
      flashdeal-kafka:
        condition: service_healthy
    networks:
      - flashdeal-network

  # ==========================================
  # 7. FLASHSALE & ORDER ENGINE SERVICE (:8083)
  # ==========================================
  flashsale-order-service:
    build:
      context: ./flashsale-order-service
      dockerfile: Dockerfile
    container_name: flashdeal-order-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8083:8083"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://flashdeal-db:5432/order_db
      SPRING_DATASOURCE_USERNAME: flashdeal_user
      SPRING_DATASOURCE_PASSWORD: flashdeal_password
      SPRING_DATA_REDIS_HOST: flashdeal-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: flashdeal-kafka:29092
      JWT_SECRET_KEY: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    depends_on:
      flashdeal-db:
        condition: service_healthy
      flashdeal-redis:
        condition: service_healthy
      flashdeal-kafka:
        condition: service_healthy
    networks:
      - flashdeal-network

  # ==========================================
  # 8. NOTIFICATION & EMAIL SERVICE (:8086)
  # ==========================================
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: flashdeal-notification-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8086:8086"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_KAFKA_BOOTSTRAP_SERVERS: flashdeal-kafka:29092
      SPRING_MAIL_USERNAME: datnguyentien2401@gmail.com
      SPRING_MAIL_PASSWORD: mtyibtjpvfsewxch
    depends_on:
      flashdeal-kafka:
        condition: service_healthy
    networks:
      - flashdeal-network

  # ==========================================
  # 8b. PAYMENT SERVICE (:8084)
  # ==========================================
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: flashdeal-payment-service
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8084:8084"
    environment:
      TZ: Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_URL: jdbc:postgresql://flashdeal-db:5432/payment_db
      SPRING_DATASOURCE_USERNAME: flashdeal_user
      SPRING_DATASOURCE_PASSWORD: flashdeal_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: flashdeal-kafka:29092
      VNP_TMN_CODE: 7CW0K93X
      VNP_HASH_SECRET: CGTQWUEKMFNKSAZNQWLLZNAAFKEYLREX
    depends_on:
      flashdeal-db:
        condition: service_healthy
      flashdeal-kafka:
        condition: service_healthy
    networks:
      - flashdeal-network

  # ==========================================
  # 9. API GATEWAY (:8080 - Cổng duy nhất cho Frontend)
  # ==========================================
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: flashdeal-gateway
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Ho_Chi_Minh
      PRODUCT_SERVICE_URL: http://product-service:8082
      AUTH_SERVICE_URL: http://auth-service:8081
      ORDER_SERVICE_URL: http://flashsale-order-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      PAYMENT_SERVICE_URL: http://payment-service:8084
    depends_on:
      - product-service
      - auth-service
      - flashsale-order-service
      - notification-service
      - payment-service
    networks:
      - flashdeal-network

networks:
  flashdeal-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
